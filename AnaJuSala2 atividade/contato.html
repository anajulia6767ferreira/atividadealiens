<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página - Contato Doce Encanto</title>
</head>
<body>
    <h1> Doce Encanto</h1>
    <h2>Entre em contato conosco!</h2>

    <p>
         Seja para encomendar doces, conhecer nossos produtos  ou tirar dúvidas, preencha o formulário abaixo.
    </p>
    <form action="#" method="post">
        <div>
            <label for="Nome">Nome completo:</label>
            <input type="text" name="nome" id="nome" required>
        </div>

        <br>

        <div>
            <label for="Email">Email:</label>
            <input type="Email" name="Email" id="Email" required>
        </div>

        <br>

        <div>
            <label for="Telefone">Telefone:</label>
            <input type="Telefone" name="Telefone" id="Telefone">
        </div>

        <br>

        <div>
            <label for="Produto"Serviço ou produto de interesse:></label>
            <select name="Produto" id="Produto">
                <option value="Selecione uma opção">Selecione uma opção</option>
                <option value="Brigadeiro">Brigadeiro</option>
                <option value="Brownie">Brownie</option>
                <option value="Bolo">Bolo</option>
            </select>
        </div>

        <br>

        <div>
            <label for="Data">Data desejada para atendimento:</label>
            <input type="Date" name="Data" id="Data">
        </div>

        <br>

        <div>
            <label for="Mensagem">Mensagem:</label>
            <textarea name="Mensagem" id="Mensagem" rows="5" cols="40" placeholder="Conte-nos o que você deseja encomendar..." required
            ></textarea>
        </div>

        <br>

        <div>
            <input type="Checkbox" name="Termos" id="Termos" required>
            <label for="Termos">Aceito os termos</label>
        </div>

        <br>

        <button type="Submit">Enviar solicitação</button>

    </form>

    <p>Doce Encanto - Feito com carinho para adoçar o seu dia!</p>

</body>
</html>
